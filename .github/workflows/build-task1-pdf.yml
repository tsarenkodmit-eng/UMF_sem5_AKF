name: Build Task 1 PDF

on:
  push:
    branches: [main]
    paths:
      - README.md
      - task1_solution.md
      - task1_wave.py
      - verify_task1.py
      - requirements.txt
      - reports/pandoc_header.tex
      - .github/workflows/build-task1-pdf.yml

permissions:
  contents: write

concurrency:
  group: task1-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-task1-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install TeX and Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-lang-cyrillic fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run finite-difference solver
        run: python task1_wave.py --output-dir results

      - name: Run regression and convergence checks
        run: python verify_task1.py

      - name: Build PDF and collect numeric artifacts
        run: |
          mkdir -p reports
          cp results/task1_displacement.png reports/task1_displacement.png
          cp results/task1_profile_t001.csv reports/task1_profile_t001.csv
          cp results/task1_diagnostics.txt reports/task1_diagnostics.txt
          cp results/task1_verification.json reports/task1_verification.json
          pandoc task1_solution.md \
            --pdf-engine=xelatex \
            --output=reports/Task1_Spherical_Wave.pdf \
            -V lang=ru \
            -V mainfont="DejaVu Serif" \
            -V sansfont="DejaVu Sans" \
            -V monofont="DejaVu Sans Mono" \
            -V papersize=a4 \
            -V geometry:margin=22mm \
            --include-in-header=reports/pandoc_header.tex

      - name: Publish generated report to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/Task1_Spherical_Wave.pdf reports/task1_displacement.png reports/task1_profile_t001.csv reports/task1_diagnostics.txt reports/task1_verification.json
          if ! git diff --cached --quiet; then
            git commit -m "Build Task 1 PDF and numerical results"
            git pull --rebase origin main
            git push
          fi
